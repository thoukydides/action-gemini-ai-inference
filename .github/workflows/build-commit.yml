name: Build and Commit "dist"
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build the project
      run: npm run build
    
    - name: Commit dist changes
      env:
        HUSKY: 0
      run: |
        if [ ! -d dist ]; then
          echo "::error title=Build failed::'dist' directory missing"
          exit 1
        fi

        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add ./dist
        if git diff --staged --quiet; then
          echo "::notice title=Build is up to date::Contents of 'dist' directory not changed"
        else
          git commit -m "Update dist folder from build [skip ci]"
          git push
          echo "::warning title=Build updated::Changes to 'dist' directory committed and pushed"
        fi